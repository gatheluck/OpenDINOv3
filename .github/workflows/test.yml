name: test

# Unit and contract tests run INSIDE the runtime image, not on the bare runner.
#
# The point of having one image for local development, CI and the cluster is
# that all three agree. Running tests against a different interpreter or a
# different set of wheels would give up that guarantee for a little speed.
#
# Measurement experiments are deliberately absent. They are non-deterministic
# and confounded, so they are pre-registered and run on the cluster by hand,
# never as a pass/fail gate.

on:
  push:
  pull_request:

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build -t opendinov3:test .

      - name: Unit and contract tests
        run: |
          docker run --rm -v "${PWD}:/w" -w /w opendinov3:test \
            python -m pytest -p no:cacheprovider --tb=short

      - name: Architectural invariants
        # Kept as a separate step so a layering violation is obvious in the
        # job summary rather than buried among unrelated failures.
        run: |
          docker run --rm -v "${PWD}:/w" -w /w opendinov3:test \
            python -m pytest -p no:cacheprovider --tb=short \
            tests/test_architecture.py

      - name: Runtime contract under Singularity-like constraints
        run: bash tests/test_container_runtime.sh opendinov3:test
