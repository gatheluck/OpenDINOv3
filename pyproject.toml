[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendinov3"
version = "0.1.0"
description = "Download large public image datasets into training-ready WebDataset shards"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
  # Drives the real pipeline: img2dataset, a local HTTP server, subprocesses.
  # Seconds rather than milliseconds, so it can be deselected during a tight
  # edit loop with -m "not integration". CI runs everything.
  "integration: exercises the full pipeline end to end",
]
